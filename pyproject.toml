[build-system]
requires = [
  "scikit-build-core==0.10.7",
  "pybind11==2.13.6",
  "cmake==3.31.6",
  "ninja==1.11.1.3",
  "build==1.5.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "chess-rl-native"
version = "0.1.0"
description = "Native build foundation for chess-rl"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/chess_rl_native"]
sdist.include = [
  "LICENSE",
  "native/third_party/chess-library/include/chess.hpp",
  "native/third_party/chess-library/LICENSE",
  "native/third_party/chess-library/PROVENANCE.json",
]

[tool.scikit-build.cmake]
version = ">=3.31"

[tool.pytest.ini_options]
testpaths = ["tests"]
